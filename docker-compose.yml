services:
  postgres:
    image: postgres:16-alpine
    container_name: billetera-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: billetera
      POSTGRES_PASSWORD: billetera
      POSTGRES_DB: billetera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billetera -d billetera"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
